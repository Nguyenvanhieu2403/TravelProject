<div class="overlay-map">
  <img src="https://angular.pixelstrap.net/rica/assets/images/map-image.svg" alt="map-icon-image" class="img-fluid blur-up lazyload">
  <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d193595.9147718689!2d-
    74.11976358820196!3d40.69740344169578!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s
    0x89c24fa5d33f083b%3A0xc80b8f06e177fe62!2sNew%20York%2C%20NY%2C%20USA!5e0!3m2!1sen!2sin
    !4v1568001991098!5m2!1sen!2sin" allowfullscreen="" style="border: 0;">
  </iframe>
  <h6>view on map</h6>
</div>
<div class="price-part">
  <div class="left-part">
    <a href="javascript:void(0)">Deluxe Rate</a>
    <span class="mt-2">
      <i class="fas fa-check"></i> 
      Room only
    </span>
    <span>
      <i class="fas fa-check"></i> 
      non refundable
    </span>
  </div>
  <div class="right-part">
     <span>per night</span>
     <p class="mt-0"><del> ${{priceOld | number : '1.2-2'}}</del></p>
     <h6> ${{priceNew * room | number : '1.2-2'}}</h6>
  </div>
</div>
<div class="book-btn-section">
  <p-calendar class="datepicker" [(ngModel)]="checkIn" placeholder="Check In" />
  <p-calendar class="datepicker mt-1" [(ngModel)]="checkOut" placeholder="Check Out" [minDate]="checkIn" />
  <div class="rooms-section">
     <input type="text" placeholder="rooms &amp; guests" class="form-control open-select" [value]="'Room: '+room+' Guests: '+ (adult+ child)" (click)="toggleShow()" (focus)="toggleShowTaget()">
     <div class="selector-box" [ngClass]="{'show': isSelectorBoxVisible}">
      <div class="room-cls">
          <label class="title_room">room {{room}}</label>
          <div class="qty-box">
            <label>adult</label>
            <div class="input-group">
              <p-toast />
              <button type="button" class="btn quantity-left-minus" (click)="removeAdult()"> - </button>
              <input type="text" [value]="adult" name="quantity" class="form-control qty-input input-number">
              <button type="button" class="btn quantity-right-plus" (click)="addAdult()">+</button>
            </div>
          </div>
          <div class="qty-box">
            <label>children</label>
            <div class="input-group">
              <button type="button" class="btn quantity-left-minus" (click)="removeChild()"> - </button>
              <input type="text" [value]="child" name="quantity" class="form-control qty-input input-number">
              <button type="button" class="btn quantity-right-plus" (click)="addChild()"> + </button>
            </div>
          </div>
      </div>
      <div class="bottom-part">
        <a href="javascript:void(0)" class="add-room" (click)="addRoom()">add room +</a>
        <a href="javascript:void(0)" class="btn" (click)="toggleShow()">apply</a>
      </div>
    </div>
  </div>
  <div class="selector">
     <select>
        <option *ngFor="let item of roomType" value="{{item.value}}" >{{item.name}}</option>
     </select>
  </div>
  <p-toast />
  <a class="btn btn-rounded btn-sm color1" (click)="booking()">book this now</a>
</div>

<section class="breadcrumb-section parallax-img pt-0 bg-size" style="background-image: url(&quot;assets/img/tours/thumbnail.jpg&quot;);">
  <img alt="background-image" class="bg-img img-fluid blur-up lazyload" style="display: none;" src="../../assets/img/tours/thumbnail.jpg">
  <div class="breadcrumb-content overlay-black">
     <div>
        <h2>holiday package</h2>
        <nav aria-label="breadcrumb" class="theme-breadcrumb">
           <ol class="breadcrumb">
              <li class="breadcrumb-item"><a href="javascript:void(0)">Home</a></li>
              <li aria-current="page" class="breadcrumb-item active">holiday package</li>
           </ol>
        </nav>
     </div>
  </div>
  <div class="bird-animation">
      <app-animation-bird></app-animation-bird>
  </div>
</section>

<section class="small-section bg-inner">
  <div class="container">
    <div class="row">
      <div class="col-12"> 
        <app-filter-tour (isShowSearch)="handleShowSearch($event)" (rangeChange)="onRangeChange($event)" (filtersChange)="onFiltersChange($event)" [PriceStart]="PriceMin" [PriceEnd]="PriceMax"></app-filter-tour>
      </div>
      <div class="col-xl-12 onclick-map show">
        <app-search-tour-location *ngIf="isShowSearch"></app-search-tour-location>
      </div>
      <div class="col-lg-12 ratio3_2">
        <app-filter-tour-data  [PriceStart]="PriceStart" [PriceEnd]="PriceEnd" [filters]="filters" (PriceChange)="onPriceChange($event)" ></app-filter-tour-data>
      </div>
    </div>
  </div>
</section>

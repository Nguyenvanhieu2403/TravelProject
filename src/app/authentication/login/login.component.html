<section class="breadcrumb-section pt-0 bg-size">
  <img src="" alt="" class="bg-img img-fluid blur-up lazyload">
  <div class="breadcrumb-content">
    <div>
      <h2>log in</h2>
      <nav class="theme-breadcrumb" aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item">
            <a href="">Home</a>
          </li>
          <li class="breadcrumb-item active" aria-current="page">
            log in
          </li>
        </ol>
      </nav>
    </div>
    <div class="title-breadcrumb">Rica</div>
  </div>
</section>
<section class="section-b-space dark-cls animated-section bg-size">
  <img src="" alt="" class="img-fluid blur-up lazyload bg-img">
  <app-login-animation></app-login-animation>
  <div class="container">
    <div class="row">
      <div class="offset-lg-3 col-lg-6 offset-sm-2 col-sm-8 col-12">
        <div class="account-sign-in">
          <div class="title">
            <h3>Login</h3>
          </div>
          <div class="login-with">
            <h6>log in with</h6>
            <div class="login-social row">
              <div class="col">
                <div class="boxes">
                  <img src="../../../assets/img/social/facebook.png" alt="" class="img-fluid blur-up lazyload">
                  <h6>facebook</h6>
                </div>
              </div>
              <div class="col">
                <div class="boxes" (click)="loginGoogle()">
                  <img src="../../../assets/img/social/google.png" alt="" class="img-fluid blur-up lazyload">
                  <h6>google</h6>
                </div>
              </div>
            </div>
            <div class="divider">
              <h6>OR</h6>
            </div>
          </div>
          <form action="">
            <div class="form-group">
              <label for="exampleInputEmail1">user name or Email address</label>
              <input type="email" id="exampleInputEmail1" [(ngModel)]="userName" name="userName" aria-describedby="emailHelp" placeholder="Enter email" class="form-control">
              <small id="emailHelp" class="form-text text-muted">We'll never share your email with anyone else.</small>
            </div>
            <div class="form-group">
              <label for="exampleInputPassword1">Password</label>
              <input type="password" id="exampleInputPassword1" [(ngModel)]="passWord" name="passWord" placeholder="Password" class="form-control">
            </div>
            <div class="form-group form-check">
              <input type="checkbox" id="exampleCheck1" class="form-check-input">
              <label for="exampleCheck1" class="form-check-label">remember me</label>
            </div>
            <div class="button-bottom">
              <p-toast></p-toast>
              <button type="submit" class="w-100 btn btn-solid" (click)="login()">login</button>
              <div class="divider">
                 <h6 _ngcontent-ng-c3052143649="">or</h6>
              </div>
              <button type="submit" class="w-100 btn btn-solid btn-outline" (click)="gotoRegister()">create account</button>
           </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
